<!doctype html>
<!--
  页面入口 HTML（Vite 的根 html）。
  职责：提供 #app 挂载点并加载 src/main.ts；所有 UI 都由 Vue 在客户端渲染。
-->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播弹幕演示 · Live Danmaku</title>
  </head>
  <body>
    <!-- Vue 应用的挂载点 -->
    <div id="app"></div>
    <!-- type="module" 是 Vite 开发/构建的入口约定 -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
